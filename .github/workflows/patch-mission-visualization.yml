name: Apply mission visualization cleanup

on:
  push:
    branches:
      - "feat/mission-visualization-photo-points"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v6
        with:
          ref: feat/mission-visualization-photo-points

      - name: Clear photo points when plan is invalidated
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("app/src/main/java/com/nv/dronemapping/MainActivity.kt")
          text = path.read_text(encoding="utf-8")

          start_marker = "    private fun invalidatePlan() {"
          end_marker = "    private fun redrawReference("
          start = text.find(start_marker)
          end = text.find(end_marker, start)
          if start < 0 or end < 0:
              raise SystemExit("invalidatePlan não encontrado")

          block = text[start:end]
          if "photoPointsOverlay = null" not in block:
              old = "        routeOverlays.clear()\n        routeArrowMarkers.clear()\n\n        clearRouteEndpointOverlays()\n"
              new = "        routeOverlays.clear()\n        routeArrowMarkers.clear()\n\n        photoPointsOverlay?.let {\n            binding.map.overlays.remove(it)\n        }\n        photoPointsOverlay = null\n\n        clearRouteEndpointOverlays()\n"
              if old not in block:
                  raise SystemExit("trecho de limpeza não encontrado")
              block = block.replace(old, new, 1)
              text = text[:start] + block + text[end:]
              path.write_text(text, encoding="utf-8")
          PY

      - name: Commit cleanup
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Nenhuma alteração necessária"
            exit 0
          fi
          git config user.name "NV Mapping Automation"
          git config user.email "actions@users.noreply.github.com"
          git add app/src/main/java/com/nv/dronemapping/MainActivity.kt
          git commit -m "Clear photo points when mission becomes invalid [skip ci]"
          git push origin HEAD:feat/mission-visualization-photo-points
