name: Fix photo point cleanup

on:
  push:
    branches:
      - "feat/mission-visualization-photo-points"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/mission-visualization-photo-points

      - name: Ensure photo points are cleared with invalid plan
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("app/src/main/java/com/nv/dronemapping/MainActivity.kt")
          text = path.read_text(encoding="utf-8")

          old = '''    private fun invalidatePlan() {

        plan =
            null
'''
          start = text.find(old)
          if start < 0:
              raise SystemExit("invalidatePlan não encontrado")

          end = text.find("    private fun redrawReference(", start)
          if end < 0:
              raise SystemExit("fim de invalidatePlan não encontrado")

          block = text[start:end]
          if "photoPointsOverlay = null" not in block:
              target = '''        routeOverlays.clear()
        routeArrowMarkers.clear()

        clearRouteEndpointOverlays()
'''
              replacement = '''        routeOverlays.clear()
        routeArrowMarkers.clear()

        photoPointsOverlay?.let {
            binding.map.overlays.remove(it)
        }
        photoPointsOverlay = null

        clearRouteEndpointOverlays()
'''
              if target not in block:
                  raise SystemExit("trecho de limpeza não encontrado")
              block = block.replace(target, replacement, 1)
              text = text[:start] + block + text[end:]
              path.write_text(text, encoding="utf-8")
          PY

      - name: Commit cleanup
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Nenhuma alteração necessária"
            exit 0
          fi
          git config user.name "NV Mapping Automation"
          git config user.email "actions@users.noreply.github.com"
          git add app/src/main/java/com/nv/dronemapping/MainActivity.kt
          git commit -m "Clear photo points when mission becomes invalid [skip ci]"
          git push origin HEAD:feat/mission-visualization-photo-points
