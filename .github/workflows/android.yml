name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master", "feat/dji-continuous-mapping" ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      NV_KEYSTORE_BASE64: ${{ secrets.NV_SIGNING_KEYSTORE_BASE64 }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'tools platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.13'
          cache-provider: basic

      - name: Run unit tests
        run: gradle :app:testDebugUnitTest --stacktrace

      - name: Require fixed signing key for installable builds
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          if [ -z "$NV_KEYSTORE_BASE64" ]; then
            echo "ERRO: a chave fixa NV_SIGNING_KEYSTORE_BASE64 não está configurada."
            echo "O workflow não vai gerar APK debug como substituto, para evitar conflito de assinatura nas atualizações."
            exit 1
          fi

      - name: Prepare fixed signing key
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          printf '%s' "$NV_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/nv-mapping-release.jks"

      - name: Build signed update APK
        if: github.event_name != 'pull_request'
        env:
          NV_SIGNING_STORE_FILE: ${{ runner.temp }}/nv-mapping-release.jks
          NV_SIGNING_STORE_PASSWORD: ${{ secrets.NV_SIGNING_STORE_PASSWORD }}
          NV_SIGNING_KEY_ALIAS: ${{ secrets.NV_SIGNING_KEY_ALIAS }}
          NV_SIGNING_KEY_PASSWORD: ${{ secrets.NV_SIGNING_KEY_PASSWORD }}
          NV_VERSION_CODE: ${{ github.run_number }}
          NV_VERSION_NAME: 1.0.${{ github.run_number }}
        run: gradle :app:assembleRelease --stacktrace

      - name: Rename signed update APK
        if: github.event_name != 'pull_request'
        run: cp app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/NV-Mapping-update.apk

      - name: Upload signed update APK
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: NV-Mapping-update
          path: app/build/outputs/apk/release/NV-Mapping-update.apk

      - name: Build debug APK for PR validation only
        if: github.event_name == 'pull_request'
        run: gradle :app:assembleDebug --stacktrace

      - name: Rename PR validation APK
        if: github.event_name == 'pull_request'
        run: cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/NV-Mapping-debug.apk

      - name: Upload PR validation APK
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: NV-Mapping-debug
          path: app/build/outputs/apk/debug/NV-Mapping-debug.apk
