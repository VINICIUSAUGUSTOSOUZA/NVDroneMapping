name: Apply mission visualization patch

on:
  push:
    branches:
      - "feat/mission-visualization-photo-points"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v6
        with:
          ref: feat/mission-visualization-photo-points

      - name: Patch MainActivity safely
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("app/src/main/java/com/nv/dronemapping/MainActivity.kt")
          text = path.read_text(encoding="utf-8")
          original = text

          def replace_once(old: str, new: str, label: str):
              global text
              if new in text:
                  return
              if old not in text:
                  raise SystemExit(f"Trecho não encontrado: {label}")
              text = text.replace(old, new, 1)

          replace_once(
              "import com.nv.dronemapping.ui.BottomNavigation\n",
              "import com.nv.dronemapping.ui.BottomNavigation\nimport com.nv.dronemapping.ui.PhotoPointsOverlay\n",
              "import PhotoPointsOverlay",
          )

          replace_once(
              "    private val routeOverlays = mutableListOf<Polyline>()\n    private val routeArrowMarkers = mutableListOf<Marker>()\n\n    private var referenceOverlay: Polygon? = null",
              "    private val routeOverlays = mutableListOf<Polyline>()\n    private val routeArrowMarkers = mutableListOf<Marker>()\n    private var photoPointsOverlay: PhotoPointsOverlay? = null\n\n    private var referenceOverlay: Polygon? = null",
              "estado da camada de fotos",
          )

          replace_once(
              "        routeOverlays.clear()\n        routeArrowMarkers.clear()\n        clearRouteEndpointOverlays()\n\n        /*\n         * PLANO DE VOO começa em CIANO.",
              "        routeOverlays.clear()\n        routeArrowMarkers.clear()\n\n        photoPointsOverlay?.let {\n            binding.map.overlays.remove(it)\n        }\n        photoPointsOverlay = null\n\n        clearRouteEndpointOverlays()\n\n        /*\n         * PLANO DE VOO começa em CIANO.",
              "limpeza da camada antes de redesenhar",
          )

          replace_once(
              "        }\n\n        redrawRouteEndpoints(\n            plan\n        )",
              "        }\n\n        photoPointsOverlay =\n            PhotoPointsOverlay(\n                plan.waypoints\n            ).also {\n                binding.map.overlays.add(it)\n            }\n\n        redrawRouteEndpoints(\n            plan\n        )",
              "desenho dos pontos de foto",
          )

          replace_once(
              "        routeArrowMarkers.forEach {\n            it.isEnabled = showRouteLayer\n        }\n\n        preferredStartMarker?.isEnabled =",
              "        routeArrowMarkers.forEach {\n            it.isEnabled = showRouteLayer\n        }\n\n        photoPointsOverlay?.isEnabled =\n            showRouteLayer\n\n        preferredStartMarker?.isEnabled =",
              "visibilidade da camada de fotos",
          )

          replace_once(
              "        routeOverlays.clear()\n        routeArrowMarkers.clear()\n\n        clearRouteEndpointOverlays()",
              "        routeOverlays.clear()\n        routeArrowMarkers.clear()\n\n        photoPointsOverlay?.let {\n            binding.map.overlays.remove(it)\n        }\n        photoPointsOverlay = null\n\n        clearRouteEndpointOverlays()",
              "limpeza dos pontos ao invalidar o plano",
          )

          replace_once(
              "        fitToPoints(\n            plan.boundary\n        )",
              "        fitToPoints(\n            plan.boundary +\n                listOfNotNull(preferredStart)\n        )",
              "enquadramento incluindo a partida",
          )

          if text != original:
              path.write_text(text, encoding="utf-8")
          PY

      - name: Commit patch
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Nenhuma alteração necessária"
            exit 0
          fi
          git config user.name "NV Mapping Automation"
          git config user.email "actions@users.noreply.github.com"
          git add app/src/main/java/com/nv/dronemapping/MainActivity.kt
          git commit -m "Show photo capture points and departure approach [skip ci]"
          git push origin HEAD:feat/mission-visualization-photo-points
